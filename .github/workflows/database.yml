name: Update News Database

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Poll official sources every 5 minutes; GitHub may delay scheduled runs during load.
    - cron: "*/5 * * * *"

concurrency:
  group: news-database
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Push Prisma Schema
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Fetch and publish fresh official student updates
        run: |
          for attempt in 1 2 3; do
            echo "Automatic official sync attempt ${attempt}/3"
            if npm run fetch:news; then
              echo "Automatic official sync completed"
              exit 0
            fi
            sleep 20
          done
          echo "Automatic official sync failed after 3 attempts"
          exit 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_API_PROVIDER: ${{ secrets.NEWS_API_PROVIDER }}
