name: Update News Database

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Push Prisma Schema
        run: npx prisma db push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: One-time reset old news
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'RESET_NEWS') }}
        run: npx tsx scripts/reset-news.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Fetch and publish fresh news
        run: npm run fetch:news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          NEWS_API_PROVIDER: ${{ secrets.NEWS_API_PROVIDER }}
